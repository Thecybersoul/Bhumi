<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the safe-area insets reach the app, so the
         green header runs under the iPhone status bar as it does natively.
         maximum-scale=1 stops iOS zooming the page when an input is focused. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Installable from Safari's Share → Add to Home Screen. Paths are
         absolute: the export is served by the website under /app. -->
    <link rel="manifest" href="/app/manifest.json" />
    <meta name="theme-color" content="#0E3B2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bhumi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0E3B2E;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* In the home-screen app on iPhone (black-translucent status bar,
         viewport-fit=cover), height: 100% stops short of the bottom of the
         screen by the home-indicator area, so a strip of the page background
         showed under the tab bar. Pinned to all four edges, the app always
         fills the display; the tab bar adds the safe-area padding itself. */
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        height: auto;
      }
      /* Anything that ever peeks out at the bottom matches the tab bar. */
      html,
      body {
        background: linear-gradient(#0E3B2E 50%, #FFFFFF 50%);
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
